---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade packages
  apt:
    upgrade: dist

- name: Install required packages
  apt:
    name:
      - curl
      - git
      - unzip
      - jq
      - python3-pip
      - ca-certificates
      - apt-transport-https
      - awscli
    state: present

- name: Check if swapfile exists
  stat:
    path: /swapfile
  register: swapfile

- name: Create 4 GB swapfile
  command: fallocate -l 4G /swapfile
  when: not swapfile.stat.exists

- name: Set swapfile permissions
  file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Format swapfile
  command: mkswap /swapfile
  when: not swapfile.stat.exists

- name: Enable swap
  command: swapon /swapfile
  when: not swapfile.stat.exists

- name: Persist swap in fstab
  mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Set swappiness
  sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: yes